services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upsilonauth
      POSTGRES_USER: upsilonauth
      POSTGRES_PASSWORD: upsilonauth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upsilonauth -d upsilonauth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  upsilonauth:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://upsilonauth:upsilonauth@postgres:5432/upsilonauth?sslmode=disable
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
